<!DOCTYPE html>
<html lang="es">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>¿Nos descualquieraamos el fin de semana?</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    width:100vw;
    height:100vh;
    overflow:hidden;

    background-image:url('fondo.png');
    background-size:cover;
    background-position:center;

    font-family:Arial, sans-serif;
}

/* CONTENEDOR DE BOTONES */
#contenedor{
    position:relative;
    width:100%;
    height:100%;
}

/* CARPETA */
.carpeta{
    position:absolute;

    width:220px;
    height:140px;

    background:#efb8b5;
    border:3px solid #e76c65;
    border-radius:12px;

    display:flex;
    justify-content:center;
    align-items:center;

    font-size:28px;
    color:#e76c65;

    cursor:pointer;

    transition:0.2s;
}

/* Pestaña superior */
.carpeta::before{
    content:"";

    position:absolute;
    top:-20px;
    left:15px;

    width:70px;
    height:25px;

    background:#efb8b5;
    border:3px solid #e76c65;
    border-bottom:none;

    border-radius:12px 12px 0 0;
}

/* SOMBRA */
.carpeta::after{
    content:"";

    position:absolute;
    top:8px;
    left:8px;

    width:100%;
    height:100%;

    border:3px solid #e76c65;
    z-index:-1;
}

/* BOTON SI */
#si{
    top:64%;
    left:38%;
}

/* BOTON NO */
#no{
    top:64%;
    left:58%;
}

.carpeta:hover{
    transform:scale(1.05);
}

</style>
</head>

<body>

<div id="contenedor">

    <div id="si" class="carpeta">
        Sí
    </div>

    <div id="no" class="carpeta">
        No
    </div>

</div>

<script>

const botonNo = document.getElementById("no");

botonNo.addEventListener("mouseover", () => {

    const ancho = window.innerWidth - 250;
    const alto = window.innerHeight - 180;

    const x = Math.random() * ancho;
    const y = Math.random() * alto;

    botonNo.style.left = x + "px";
    botonNo.style.top = y + "px";

});

document.getElementById("si").addEventListener("click", () => {

    alert("❤️ Sabía que dirías que sí ❤️");

});

</script>

</body>

</html>
